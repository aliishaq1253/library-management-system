spring.application.name=library-management-system
server.port=8080

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# update: keep the schema in sync with the entities on every restart (fine for dev/portfolio use)
spring.jpa.hibernate.ddl-auto=update
# show the generated SQL in the console - useful to explain/debug queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console ---
# available at http://localhost:8080/h2-console once the app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
